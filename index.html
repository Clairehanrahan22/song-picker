<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Song Rotation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-12">

  <!-- Header & Navigation -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-music text-indigo-400 text-xl"></i>
          <h1 class="font-bold text-lg text-white">Song Rotation</h1>
        </div>
        <div id="syncStatus" class="flex items-center gap-1.5 text-xs text-amber-400 bg-amber-950/60 px-2.5 py-1 rounded-full border border-amber-800/50">
          <i class="fa-solid fa-database text-[10px] animate-pulse"></i>
          <span>Connecting...</span>
        </div>
      </div>

      <!-- Class Period Tabs Selector -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 text-sm font-medium" id="classTabs">
        <!-- Class tabs injected via JavaScript -->
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-xl mx-auto w-full px-4 pt-4 flex-1 flex flex-col gap-5">

    <!-- TODAY'S DJ CARD -->
    <section class="bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-indigo-500/10 text-9xl font-black pointer-events-none select-none">
        <i class="fa-solid fa-compact-disc"></i>
      </div>

      <div class="flex items-center justify-between mb-1">
        <span class="text-xs uppercase tracking-wider font-semibold text-indigo-300 flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          Current DJ (<span id="currentClassName">1st Hour</span>)
        </span>
      </div>

      <div class="my-3">
        <h2 id="todayDJName" class="text-3xl font-extrabold text-white tracking-tight">---</h2>
        <p id="todaySubtext" class="text-xs text-indigo-200/80 mt-1">First up in rotation</p>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex items-center gap-2 mt-4 pt-3 border-t border-indigo-500/20">
        <button id="btnMarkAbsent" onclick="toggleTodayAbsent()" class="flex-1 bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/40 text-rose-200 text-xs py-2.5 px-3 rounded-lg font-medium transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user-slash"></i>
          <span>Mark Absent</span>
        </button>

        <button onclick="finishTurnAndRotate()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2.5 px-3 rounded-lg font-bold transition flex items-center justify-center gap-1.5 shadow-lg">
          <i class="fa-solid fa-check"></i>
          <span>Done (Next DJ)</span>
        </button>
      </div>
    </section>

    <!-- ROTATION QUEUE LIST -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-list-ol text-indigo-400"></i>
          Up Next in Queue
        </h3>
      </div>

      <div id="queueList" class="space-y-2">
        <!-- List items rendered dynamically -->
      </div>
    </section>

    <!-- MANAGE ROSTER SECTION -->
    <section class="mt-2 bg-slate-800/80 border border-slate-700/80 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-users text-slate-400"></i>
          <span id="rosterTitle">1st Hour Roster</span>
        </h3>
        <button onclick="openAddStudentModal()" class="text-xs bg-slate-700 hover:bg-slate-600 text-indigo-300 px-2.5 py-1 rounded border border-slate-600 transition flex items-center gap-1">
          <i class="fa-solid fa-plus text-[10px]"></i> Add Student
        </button>
      </div>

      <div id="rosterList" class="divide-y divide-slate-700/50 text-sm">
        <!-- Roster list items rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- ADD STUDENT MODAL -->
  <div id="studentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white">Add New Student</h3>
        <button onclick="closeAddStudentModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Student Name</label>
          <input type="text" id="inputStudentName" placeholder="e.g. Alex Smith" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Attendance Schedule</label>
          <select id="selectSchedule" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="daily">Everyday Student</option>
            <option value="mon_biweekly">Every Other Monday Student</option>
            <option value="mon_only">Every Monday Student</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddStudentModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700">Cancel</button>
        <button onclick="saveNewStudent()" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow">Save Student</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7Y1bMaB1m04yu6-gaL5_d1pTVI5YYaBk",
      authDomain: "song-picker-3f02b.firebaseapp.com",
      projectId: "song-picker-3f02b",
      storageBucket: "song-picker-3f02b.firebasestorage.app",
      messagingSenderId: "390209121255",
      appId: "1:390209121255:web:9a87282973a0667c3f2b42",
      measurementId: "G-6GQRQ8HZJV"
    };

    let db = null;
    let isFirebaseConfigured = false;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      isFirebaseConfigured = true;
    } catch (e) {
      console.warn("Firebase initialization failed, using local storage fallback", e);
    }

    const CLASS_LIST = ['1st', '2nd', '3rd', '4a', '4b', '4c', '5th', 'Homeroom'];
    let currentClass = '1st';
    let appState = {};

    document.addEventListener('DOMContentLoaded', () => {
      renderClassTabs();
      loadAppData();
    });

    function updateSyncStatusUI() {
      const statusEl = document.getElementById('syncStatus');
      if (isFirebaseConfigured) {
        statusEl.className = "flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800/50";
        statusEl.innerHTML = `<i class="fa-solid fa-cloud text-[10px]"></i><span>Synced to Firebase</span>`;
      } else {
        statusEl.className = "flex items-center gap-1.5 text-xs text-amber-400 bg-amber-950/60 px-2.5 py-1 rounded-full border border-amber-800/50";
        statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-[10px]"></i><span>Local Storage</span>`;
      }
    }

    function loadAppData() {
      if (isFirebaseConfigured) {
        db.collection('songTracker').doc('masterState').onSnapshot((doc) => {
          if (doc.exists) {
            appState = doc.data().classes || {};
            ensureClassDefaults();
            updateSyncStatusUI();
            renderAll();
          } else {
            initDefaultState();
          }
        }, (err) => {
          console.error("Firestore read error, initializing defaults locally...", err);
          initDefaultState();
        });
      } else {
        loadFromLocalStorage();
      }
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('classroom_song_tracker_v3');
      if (saved) {
        appState = JSON.parse(saved);
      } else {
        initDefaultState();
      }
      ensureClassDefaults();
      updateSyncStatusUI();
      renderAll();
    }

    function initDefaultState() {
      appState = {};
      CLASS_LIST.forEach(cls => {
        appState[cls] = { students: [], isTopAbsent: false };
      });
      saveAppData();
    }

    function ensureClassDefaults() {
      CLASS_LIST.forEach(cls => {
        if (!appState[cls]) {
          appState[cls] = { students: [], isTopAbsent: false };
        }
      });
    }

    function saveAppData() {
      updateSyncStatusUI();
      renderAll();
      if (isFirebaseConfigured) {
        db.collection('songTracker').doc('masterState').set({
          classes: appState,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.error("Firebase write error:", err));
      } else {
        localStorage.setItem('classroom_song_tracker_v3', JSON.stringify(appState));
      }
    }

    function renderClassTabs() {
      const container = document.getElementById('classTabs');
      container.innerHTML = CLASS_LIST.map(cls => {
        const isActive = cls === currentClass;
        const activeClasses = isActive 
          ? 'bg-indigo-600 text-white shadow font-bold' 
          : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700';
        return `
          <button onclick="switchClass('${cls}')" class="px-3 py-1.5 rounded-lg whitespace-nowrap transition flex items-center gap-1.5 ${activeClasses}">
            <span>${cls === 'Homeroom' ? 'HR' : cls + ' Hr'}</span>
          </button>
        `;
      }).join('');
    }

    function switchClass(classId) {
      currentClass = classId;
      renderClassTabs();
      renderAll();
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    // AUTOMATIC ELECTION LOGIC
    function getTodayActiveDJIndex(students, isTopAbsent) {
      if (!students || students.length === 0) return -1;

      const now = new Date();
      const dayOfWeek = now.getDay(); 
      const isMonday = (dayOfWeek === 1);
      const currentWeekNum = getWeekNumber(now);

      for (let i = 0; i < students.length; i++) {
        const candidate = students[i];

        if (i === 0 && isTopAbsent) continue;

        // Monday-Only Rules
        if (candidate.schedule === 'mon_only' && !isMonday) continue;

        // Every-Other-Monday Rules
        if (candidate.schedule === 'mon_biweekly') {
          if (!isMonday) continue; // Skip on Tue-Sun
          
          const lastWeekTurn = candidate.lastWeekTurn || 0;
          if (lastWeekTurn === currentWeekNum) continue; // Already went this Monday
        }

        return i;
      }

      return 0; // Fallback
    }

    function renderAll() {
      const classData = appState[currentClass] || { students: [], isTopAbsent: false };
      document.getElementById('currentClassName').textContent = currentClass === 'Homeroom' ? 'Homeroom' : currentClass + ' Hr';
      document.getElementById('rosterTitle').textContent = `${currentClass === 'Homeroom' ? 'Homeroom' : currentClass + ' Hr'} Roster`;
      
      renderDJCard(classData);
      renderQueueList(classData);
      renderRoster(classData);
    }

    function renderDJCard(classData) {
      const nameEl = document.getElementById('todayDJName');
      const subtextEl = document.getElementById('todaySubtext');
      const btnAbsent = document.getElementById('btnMarkAbsent');
      const students = classData.students || [];

      if (students.length === 0) {
        nameEl.textContent = "No Students";
        subtextEl.textContent = "Add students to this class roster below to start.";
        btnAbsent.classList.add('hidden');
        return;
      }

      btnAbsent.classList.remove('hidden');
      const activeIdx = getTodayActiveDJIndex(students, classData.isTopAbsent);
      const activeStudent = students[activeIdx] || students[0];
      const topStudent = students[0];

      nameEl.textContent = activeStudent.name;

      if (classData.isTopAbsent && activeIdx > 0) {
        subtextEl.innerHTML = `<span class="text-rose-400 font-medium"><i class="fa-solid fa-user-slash"></i> ${topStudent.name} is absent today.</span> ${activeStudent.name} is filling in; ${topStudent.name} stays #1 for next time.`;
        btnAbsent.innerHTML = `<i class="fa-solid fa-user-check"></i><span>Mark ${topStudent.name} Present</span>`;
        btnAbsent.className = "flex-1 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 text-emerald-200 text-xs py-2.5 px-3 rounded-lg font-medium transition flex items-center justify-center gap-1.5";
      } else if ((topStudent.schedule === 'mon_only' || topStudent.schedule === 'mon_biweekly') && activeIdx > 0) {
        subtextEl.innerHTML = `<span class="text-amber-300 font-medium"><i class="fa-solid fa-clock"></i> ${topStudent.name} is ${topStudent.schedule === 'mon_biweekly' ? 'Every Other Monday' : 'Monday-Only'}.</span> Today isn't her Monday turn, so ${activeStudent.name} is up today!`;
        btnAbsent.innerHTML = `<i class="fa-solid fa-user-slash"></i><span>Mark Absent</span>`;
        btnAbsent.className = "flex-1 bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/40 text-rose-200 text-xs py-2.5 px-3 rounded-lg font-medium transition flex items-center justify-center gap-1.5";
      } else {
        subtextEl.textContent = activeStudent.schedule === 'mon_biweekly' ? "Every Other Monday Student • Active Today!" : "On Schedule";
        btnAbsent.innerHTML = `<i class="fa-solid fa-user-slash"></i><span>Mark Absent</span>`;
        btnAbsent.className = "flex-1 bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/40 text-rose-200 text-xs py-2.5 px-3 rounded-lg font-medium transition flex items-center justify-center gap-1.5";
      }
    }

    function renderQueueList(classData) {
      const container = document.getElementById('queueList');
      const students = classData.students || [];

      if (students.length <= 1) {
        container.innerHTML = `<div class="p-4 text-center text-slate-500 text-sm bg-slate-800/40 rounded-xl border border-slate-700/50">Add more students to view the rotation queue.</div>`;
        return;
      }

      const activeIdx = getTodayActiveDJIndex(students, classData.isTopAbsent);

      container.innerHTML = students.map((student, idx) => {
        const isActiveToday = (idx === activeIdx);
        let scheduleBadge = '';
        if (student.schedule === 'mon_biweekly') scheduleBadge = 'Every Other Mon';
        else if (student.schedule === 'mon_only') scheduleBadge = 'Mon Only';

        return `
          <div class="flex items-center justify-between p-3 rounded-xl border ${isActiveToday ? 'bg-indigo-950/60 border-indigo-500/60 text-white' : 'bg-slate-800/60 border-slate-700/60 text-slate-300'} transition">
            <div class="flex items-center gap-3">
              <div class="w-8 font-mono text-xs ${isActiveToday ? 'text-emerald-400 font-bold' : 'text-indigo-400 font-bold'}">
                #${idx + 1}
              </div>
              <div>
                <div class="font-medium text-sm ${isActiveToday ? 'text-indigo-200 font-bold' : 'text-slate-200'}">
                  ${student.name}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              ${isActiveToday ? '<span class="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800/50 font-semibold">Active DJ</span>' : ''}
              ${scheduleBadge ? `<span class="text-[10px] bg-amber-950/80 text-amber-300 px-2 py-0.5 rounded border border-amber-800/50">${scheduleBadge}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRoster(classData) {
      const container = document.getElementById('rosterList');
      const students = classData.students || [];

      if (students.length === 0) {
        container.innerHTML = `<div class="py-3 text-center text-slate-500 text-xs">No students added to ${currentClass} period yet.</div>`;
        return;
      }

      container.innerHTML = students.map((s, idx) => `
        <div class="py-2.5 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-500 font-mono w-4">${idx + 1}.</span>
            <span class="font-medium text-slate-200">${s.name}</span>
            ${s.schedule === 'mon_biweekly' ? '<span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded">Every Other Mon</span>' : ''}
            ${s.schedule === 'mon_only' ? '<span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded">Mon Only</span>' : ''}
          </div>
          <button onclick="removeStudent('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>
      `).join('');
    }

    function finishTurnAndRotate() {
      const classData = appState[currentClass];
      if (!classData.students || classData.students.length === 0) return;

      const activeIdx = getTodayActiveDJIndex(classData.students, classData.isTopAbsent);

      if (activeIdx >= 0 && activeIdx < classData.students.length) {
        const finishedStudent = classData.students[activeIdx];
        
        if (finishedStudent.schedule === 'mon_biweekly') {
          // Log current week number so she skips next week's Monday!
          finishedStudent.lastWeekTurn = getWeekNumber(new Date());
        }

        // Rotate finished DJ to the bottom of the queue
        classData.students.splice(activeIdx, 1);
        classData.students.push(finishedStudent);
        classData.isTopAbsent = false;
      }

      saveAppData();
    }

    function toggleTodayAbsent() {
      const classData = appState[currentClass];
      if (!classData.students || classData.students.length === 0) return;

      classData.isTopAbsent = !classData.isTopAbsent;
      saveAppData();
    }

    function openAddStudentModal() {
      document.getElementById('studentModal').classList.remove('hidden');
      document.getElementById('studentModal').classList.add('flex');
    }

    function closeAddStudentModal() {
      document.getElementById('studentModal').classList.add('hidden');
      document.getElementById('studentModal').classList.remove('flex');
      document.getElementById('inputStudentName').value = '';
    }

    function saveNewStudent() {
      const name = document.getElementById('inputStudentName').value.trim();
      const schedule = document.getElementById('selectSchedule').value;

      if (!name) return;

      const newStudent = {
        id: Date.now().toString(),
        name: name,
        schedule: schedule,
        lastWeekTurn: 0
      };

      if (!appState[currentClass].students) {
        appState[currentClass].students = [];
      }

      appState[currentClass].students.push(newStudent);
      saveAppData();
      closeAddStudentModal();
    }

    function removeStudent(studentId) {
      if (!confirm("Are you sure you want to remove this student from the class?")) return;
      appState[currentClass].students = appState[currentClass].students.filter(s => s.id !== studentId);
      saveAppData();
    }
  </script>
</body>
</html>
